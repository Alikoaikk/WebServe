<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-label="An HTTP request and the response of webserv, line by line, with the parser state of each part."><title>HTTP request and response, byte by byte</title><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#111A33"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#22305A"/>
  </pattern>
  <clipPath id="card"><rect width="1280" height="500" rx="26"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<g clip-path="url(#card)">
  <rect width="1280" height="500" fill="url(#bg)"/>
  <rect width="1280" height="500" fill="url(#dots)" opacity="0.55"/>
  <rect width="1280" height="56" fill="#0D1429" opacity="0.9"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#1C2850"/>
  <circle cx="32" cy="28" r="6.5" fill="#FF5F57"/>
  <circle cx="54" cy="28" r="6.5" fill="#FEBC2E"/>
  <circle cx="76" cy="28" r="6.5" fill="#28C840"/>
  <text x="640.0" y="33" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#93A4C8">one request, one response — byte by byte</text>
  <rect x="40" y="76" width="560" height="354" rx="16" fill="#0C1430" stroke="#1C2850"/><text x="60" y="106" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#38BDF8">REQUEST</text><text x="580" y="106" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12" fill="#56679A">client → webserv</text><rect x="58" y="136" width="4" height="30" rx="2" fill="#38BDF8"/><text x="74" y="157" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">POST /upload/notes.txt HTTP/1.1<tspan fill="#56679A"> \r\n</tspan></text><rect x="58" y="174" width="4" height="30" rx="2" fill="#A78BFA"/><text x="74" y="195" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">Host: localhost:8080<tspan fill="#56679A"> \r\n</tspan></text><rect x="58" y="212" width="4" height="30" rx="2" fill="#A78BFA"/><text x="74" y="233" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">Content-Type: text/plain<tspan fill="#56679A"> \r\n</tspan></text><rect x="58" y="250" width="4" height="30" rx="2" fill="#A78BFA"/><text x="74" y="271" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">Content-Length: 11<tspan fill="#56679A"> \r\n</tspan></text><rect x="58" y="288" width="4" height="30" rx="2" fill="#A78BFA"/><text x="74" y="309" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">Connection: close<tspan fill="#56679A"> \r\n</tspan></text><rect x="58" y="326" width="4" height="30" rx="2" fill="#56679A"/><text x="74" y="347" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7"><tspan fill="#56679A"> \r\n</tspan></text><rect x="58" y="364" width="4" height="30" rx="2" fill="#FBBF24"/><text x="74" y="385" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">hello world<tspan fill="#56679A"> \r\n</tspan></text><path d="M420,136 h6 V166 h-6" fill="none" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1.5"/><text x="438" y="147.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#38BDF8">request line</text><text x="438" y="163.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">PARSE_REQUEST_LINE</text><path d="M420,174 h6 V318 h-6" fill="none" stroke="#A78BFA" stroke-opacity="0.8" stroke-width="1.5"/><text x="438" y="234.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#A78BFA">headers</text><text x="438" y="250.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">PARSE_HEADERS</text><text x="438" y="266.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">keys made lower-case</text><path d="M420,326 h6 V356 h-6" fill="none" stroke="#56679A" stroke-opacity="0.8" stroke-width="1.5"/><text x="438" y="337.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#56679A">empty line</text><text x="438" y="353.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">→ PARSE_BODY</text><path d="M420,364 h6 V394 h-6" fill="none" stroke="#FBBF24" stroke-opacity="0.8" stroke-width="1.5"/><text x="438" y="375.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FBBF24">body: 11 bytes</text><text x="438" y="391.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">→ PARSE_COMPLETE</text><rect x="680" y="76" width="560" height="354" rx="16" fill="#0C1430" stroke="#1C2850"/><text x="700" y="106" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#4ADE80">RESPONSE</text><text x="1220" y="106" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12" fill="#56679A">webserv → client</text><rect x="698" y="136" width="4" height="30" rx="2" fill="#4ADE80"/><text x="714" y="157" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">HTTP/1.1 201 Created<tspan fill="#56679A"> \r\n</tspan></text><rect x="698" y="174" width="4" height="30" rx="2" fill="#A78BFA"/><text x="714" y="195" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">Connection: close<tspan fill="#56679A"> \r\n</tspan></text><rect x="698" y="212" width="4" height="30" rx="2" fill="#A78BFA"/><text x="714" y="233" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">Content-Type: text/plain<tspan fill="#56679A"> \r\n</tspan></text><rect x="698" y="250" width="4" height="30" rx="2" fill="#A78BFA"/><text x="714" y="271" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">Location: /upload/notes.txt<tspan fill="#56679A"> \r\n</tspan></text><rect x="698" y="288" width="4" height="30" rx="2" fill="#F472B6"/><text x="714" y="309" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">Content-Length: 7<tspan fill="#56679A"> \r\n</tspan></text><rect x="698" y="326" width="4" height="30" rx="2" fill="#56679A"/><text x="714" y="347" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7"><tspan fill="#56679A"> \r\n</tspan></text><rect x="698" y="364" width="4" height="30" rx="2" fill="#FBBF24"/><text x="714" y="385" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#E6EDF7">Created<tspan fill="#56679A"> \r\n</tspan></text><path d="M1060,136 h6 V166 h-6" fill="none" stroke="#4ADE80" stroke-opacity="0.8" stroke-width="1.5"/><text x="1078" y="147.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#4ADE80">status line</text><text x="1078" y="163.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">setStatusCode(201)</text><path d="M1060,174 h6 V280 h-6" fill="none" stroke="#A78BFA" stroke-opacity="0.8" stroke-width="1.5"/><text x="1078" y="215.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#A78BFA">headers</text><text x="1078" y="231.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">setHeader()</text><text x="1078" y="247.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">std::map, so A → Z</text><path d="M1060,288 h6 V318 h-6" fill="none" stroke="#F472B6" stroke-opacity="0.8" stroke-width="1.5"/><text x="1078" y="299.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#F472B6">always added</text><text x="1078" y="315.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">by Response::build()</text><path d="M1060,326 h6 V356 h-6" fill="none" stroke="#56679A" stroke-opacity="0.8" stroke-width="1.5"/><text x="1078" y="345.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#56679A">empty line</text><path d="M1060,364 h6 V394 h-6" fill="none" stroke="#FBBF24" stroke-opacity="0.8" stroke-width="1.5"/><text x="1078" y="375.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#FBBF24">body</text><text x="1078" y="391.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#93A4C8">setBody(&quot;Created&quot;)</text><line x1="604" y1="262" x2="676" y2="262" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line><path d="M668,256 L677,262 L668,268" fill="none" stroke="#38BDF8" stroke-width="2"/><rect x="606" y="218" width="68" height="26" rx="8" fill="#0D1631" stroke="#38BDF8" stroke-opacity="0.7"/><text x="640" y="235.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11" fill="#38BDF8">webserv</text><text x="640" y="288" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="10" fill="#56679A">handlePost()</text><text x="640.0" y="470" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#93A4C8">Every line ends with <tspan font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" fill="#E6EDF7">\r\n</tspan>. The empty line ends the headers. <tspan font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" fill="#E6EDF7">Content-Length</tspan> (or chunked encoding) tells where the body ends.</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="499" rx="26" fill="none" stroke="#26365F"/></svg>
