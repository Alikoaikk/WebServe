<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index of {{PATH}}</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--row:#243149;--text:#e2e8f0;
        --muted:#94a3b8;--accent:#38bdf8;--border:#334155;}
  *{box-sizing:border-box;}
  body{margin:0;padding:2rem 1rem;font-family:-apple-system,Segoe UI,
       Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}

  h1 span{color:var(--text);}
  .list{background:var(--card);border:1px solid var(--border);
        border-radius:12px;overflow:hidden;}
  a.item{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.1rem;
         color:var(--text);text-decoration:none;border-top:1px solid var(--border);
         transition:background .15s ease;}
  a.item:first-child{border-top:none;}
  a.item:hover{background:var(--row);}
  a.item .ico{width:1.4rem;text-align:center;font-size:1.1rem;}
  a.item .name{flex:1;word-break:break-all;}
  a.dir .name{color:var(--accent);font-weight:500;}
  footer{margin-top:1rem;color:var(--muted);font-size:.8rem;text-align:center;}

</head>
