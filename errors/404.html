<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            color: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        /* floating blurred blobs for depth */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 12s ease-in-out infinite;
        }
        .blob.one   { width: 340px; height: 340px; background: #6366f1; top: -80px; left: -60px; }
        .blob.two   { width: 300px; height: 300px; background: #a855f7; bottom: -90px; right: -50px; animation-delay: -4s; }
        .blob.three { width: 220px; height: 220px; background: #ec4899; top: 40%; right: 20%; animation-delay: -8s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(20px, -30px) scale(1.08); }
        }

        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 3.5rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 480px;
        }

        .code {
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -4px;
            background: linear-gradient(180deg, #ffffff, #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 2rem;
        }

        .home-btn {
            display: inline-block;
            padding: 0.85rem 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e1b4b;
            background: linear-gradient(135deg, #e0e7ff, #c4b5fd);
            border-radius: 999px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 24px rgba(196, 181, 253, 0.35);
        }
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(196, 181, 253, 0.5);
        }

        .divider {
            width: 60px;
            height: 3px;
            margin: 0 auto 1.5rem;
            border-radius: 999px;
            background: linear-gradient(90deg, #818cf8, #c084fc);
        }
    </style>
</head>
<body>
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>

    <main class="card">
        <div class="code">404</div>
        <div class="divider"></div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist, was moved, or is temporarily unavailable.</p>
        <a class="home-btn" href="/">Back to Home</a>
    </main>
</body>
</html>
