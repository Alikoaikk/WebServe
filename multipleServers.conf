http {
    server {
        listen               0.0.0.0:8080;
        client_max_body_size 100M;

        error_page 400 /errors/400.html;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 405 /errors/405.html;
        error_page 411 /errors/411.html;
        error_page 413 /errors/413.html;
        error_page 500 /errors/500.html;
        error_page 501 /errors/501.html;
        error_page 502 /errors/502.html;
        error_page 503 /errors/503.html;
        error_page 504 /errors/504.html;

        location / {
            methods   GET POST;
            root      www/multipleServers/html;
            index     index.html;
            autoindex off;
        }

        location /files {
            methods   GET;
            root      www/multipleServers/files;
            autoindex on;
        }

        location /upload {
            methods      POST DELETE;
            root         www/multipleServers/uploads;
            upload_store www/multipleServers/uploads;
        }

        location /old {
            return 301 /new;
        }

        location /cgi-bin {
            methods  GET POST;
            root     www/multipleServers/cgi-bin;
            cgi_pass .py;
        }

        location /php {
            methods  GET POST;
            root     www/multipleServers/php;
            cgi_pass .php;
        }
    }

    server {
        listen               127.0.0.1:8081;
        client_max_body_size 1K;

        error_page 404 /www/multipleServers/custom/404.html;
        error_page 500 /www/multipleServers/custom/500.html;

        location / {
            methods   GET;
            root      www/multipleServers/site2;
            index     index.html;
            autoindex off;
        }

        location /secret {
            return 301 /;
        }

        location /data {
            methods      GET POST DELETE;
            root         www/multipleServers/data;
            autoindex    on;
            upload_store www/multipleServers/data/uploads;
        }
    }

    server {
        listen               127.0.0.1:9000;
        client_max_body_size 512K;

        error_page 404 /www/multipleServers/app/404.html;

        location / {
            methods   GET POST;
            root      www/multipleServers/app;
            index     app.html;
            autoindex off;
        }

        location /api {
            methods  GET POST DELETE;
            root     www/multipleServers/api;
            index    index.html;
            cgi_pass .py;
        }

        location /static {
            methods   GET;
            root      www/multipleServers/static;
            autoindex on;
        }

        location /redirect-me {
            return 301 /api;
        }

        location /upload {
            methods      POST;
            root         www/multipleServers/app/uploads;
            upload_store www/multipleServers/app/uploads;
        }
    }
}
