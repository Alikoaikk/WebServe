http {
    server {
        listen               127.0.0.1:8081;
        client_max_body_size 5M;

        error_page 400 /errors/400.html;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 405 /errors/405.html;
        error_page 500 /errors/500.html;

        # ---- static site (GET only, has an index page) ----
        location / {
            methods   GET;
            root      www/test/site;
            index     index.html;
            autoindex off;
        }

        # ---- directory listing (autoindex on, no index file) ----
        location /static {
            methods   GET;
            root      www/test/static;
            autoindex on;
        }

        # ---- file upload + listing + delete ----
        # root and upload_store point to the SAME dir so that
        # POST (uses upload_store) and GET/DELETE (use root) all agree.
        location /uploads {
            methods      GET POST DELETE;
            root         www/test/uploads;
            upload_store www/test/uploads;
            autoindex    on;
        }

        # ---- HTTP redirect ----
        location /old {
            methods GET;
            return  301 /;
        }

        # ---- CGI (python) ----
        location /cgi-bin {
            methods  GET POST;
            root     www/test/cgi-bin;
            cgi_pass .py /usr/bin/python3;
        }
    }
}
